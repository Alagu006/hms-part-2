# Docker Compose stack for local HMS development.
#
# Ports/credentials mirror server/.env and server/.env.example so the server
# can run on the host and talk to every service with zero manual setup:
#   - Postgres : 5555  (superuser postgres/root for bootstrap only — see below)
#   - Redis    : 6379  (no password)
#   - MailHog  : 1025  (SMTP), 8025 (web UI)
#   - ClamAV   : 3310  (clamd TCP — used by src/modules/files/file.service.js)
#
# Least-privilege roles: the running API uses hms_api (DML only, no DDL), the
# migration runner uses hms_migrator (DDL). Postgres superuser (DB_SUPERUSER)
# is used ONLY to provision those roles. See server/src/db/setup-roles.js.
#
# Usage:
#   docker compose up -d
#   (optional) bootstrap a brand-new database + roles + migrations:
#     cat server/src/db/schema.sql | docker compose exec -T postgres psql -U postgres -d hms_db
#     cd server && npm run db:setup-roles && npm run migrate
#   (existing database) just ensure roles exist, then migrate:
#     cd server && npm run db:setup-roles && npm run migrate

services:
  postgres:
    image: postgres:16-alpine
    container_name: hms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: hms_db
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hms_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: hms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  clamav:
    image: clamav/clamav:stable
    container_name: hms-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/clamav/clamd.sock || (test -n \"$(echo | timeout 3 bash -c 'cat < /dev/tcp/127.0.0.1/3310' 2>/dev/null)\" && exit 0 || exit 1)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    # ClamAV downloads virus definitions on first boot; allow extra time.
    environment:
      CLAMAV_STARTUP_TIMEOUT: 300s

  mailhog:
    image: mailhog/mailhog
    container_name: hms-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  clamav_db:
