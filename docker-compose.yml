version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-hms}
      POSTGRES_USER:     ${DB_USER:-hms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./server/src/db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-hms_user} -d ${DB_NAME:-hms}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hms_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-changeme}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node API server ─────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hms_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:               production
      PORT:                   ${PORT:-4000}
      CLIENT_ORIGIN:          ${CLIENT_ORIGIN:-http://localhost:5173}

      # Database
      DB_HOST:                postgres
      DB_PORT:                5432
      DB_NAME:                ${DB_NAME:-hms}
      DB_USER:                ${DB_USER:-hms_user}
      DB_PASSWORD:            ${DB_PASSWORD:-changeme}
      DB_POOL_MAX:            20

      # Redis
      REDIS_HOST:             redis
      REDIS_PORT:             6379
      REDIS_PASSWORD:         ${REDIS_PASSWORD:-changeme}

      # JWT (RS256 key paths inside container)
      JWT_PRIVATE_KEY_PATH:   /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH:    /run/secrets/jwt_public_key
      JWT_ISSUER:             ${JWT_ISSUER:-hms}
      JWT_AUDIENCE:           ${JWT_AUDIENCE:-hms-client}

      # Encryption
      DB_ENCRYPTION_KEY:      ${DB_ENCRYPTION_KEY}

      # Web Push (VAPID)
      VAPID_PUBLIC_KEY:       ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY:      ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT:          ${VAPID_SUBJECT:-mailto:admin@hospital.local}

      # File storage
      FILE_STORAGE_PATH:      /app/uploads
      MAX_FILE_SIZE_BYTES:    20971520

      # OpenAI (chatbot)
      OPENAI_API_KEY:         ${OPENAI_API_KEY}

      # AWS S3 (optional report storage)
      AWS_REGION:             ${AWS_REGION}
      AWS_S3_BUCKET:          ${AWS_S3_BUCKET}
    secrets:
      - jwt_private_key
      - jwt_public_key
    volumes:
      - uploads:/app/uploads
    ports:
      - '${PORT:-4000}:${PORT:-4000}'

  # ── React dev server ────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: hms_client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL:    http://localhost:${PORT:-4000}/api
      VITE_SOCKET_URL: http://localhost:${PORT:-4000}
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - '5173:5173'

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads:

# ── Secrets (mount RSA key files) ────────────────────────────────────────────
secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_key:
    file: ./secrets/jwt_public.pem
